<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault - Crypto Terminal</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #root { height: 100%; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
const { useState, useEffect } = React;

const F = "'Lucida Console', 'Consolas', 'Courier New', monospace";
const C = {
  bg: "#0c0c1a",
  panel: "#0a0a14",
  hdrOrange: "#c85a17",
  hdrGreen: "#1a7a3a",
  hdrBlue: "#2d5aa0",
  border: "#1e1e36",
  text: "#c8c8d8",
  dim: "#6a6a8a",
  muted: "#3a3a5a",
  white: "#eeeef4",
  orange: "#ff8c00",
  green: "#00dd44",
  red: "#ff3344",
  amber: "#ffaa00",
  cyan: "#00cccc",
};

const fmt = (n) => n.toLocaleString("en-US", { maximumFractionDigits: 0 });
const fmtD = (n, d = 2) => n.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const pC = (v) => (v > 0 ? C.green : v < 0 ? C.red : C.dim);

const Header = ({ children, color = C.hdrOrange, right }) => (
  <div style={{ background: color, padding: "2px 6px", display: "flex", justifyContent: "space-between" }}>
    <span style={{ fontFamily: F, fontSize: 11, fontWeight: 700, color: "#fff" }}>{children}</span>
    {right && <span style={{ fontFamily: F, fontSize: 9, color: "#ffffffaa" }}>{right}</span>}
  </div>
);

const Label = ({ children }) => (
  <span style={{ fontFamily: F, fontSize: 9, color: C.muted, letterSpacing: "0.04em" }}>{children}</span>
);

const Val = ({ children, color = C.white, size = 13 }) => (
  <span style={{ fontFamily: F, fontSize: size, fontWeight: 600, color }}>{children}</span>
);

const initBtc = { price: 106224, amount: 4.82, cost: 42180, chg24: 3.89, chg7d: -1.2, hi52: 109800, lo52: 38400 };
const initEth = { price: 2680, amount: 91.4, cost: 1820, chg24: 2.14, chg7d: -4.1, hi52: 4092, lo52: 1520 };
const staked = { amount: 32.0, grossApy: 3.52, fee: 0.10, protocol: "Everstake", via: "Trezor Suite", startDate: "Jun 12, 2024", originalDeposit: 30.4 };
const stakedNetApy = staked.grossApy * (1 - staked.fee);
const unstaked = initEth.amount - staked.amount;

function Vault() {
  const [btc, setBtc] = useState(initBtc);
  const [eth, setEth] = useState(initEth);
  const [now, setNow] = useState(new Date());
  const [flash, setFlash] = useState(null);
  const [spark, setSpark] = useState(() => Array.from({ length: 60 }, () => 750000 + (Math.random() - 0.48) * 30000));
  const [cmd, setCmd] = useState("");

  useEffect(() => {
    const iv = setInterval(() => {
      setNow(new Date());
      setBtc(p => {
        const np = p.price * (1 + (Math.random() - 0.497) * 0.003);
        return { ...p, price: np };
      });
      setEth(p => {
        const np = p.price * (1 + (Math.random() - 0.497) * 0.004);
        return { ...p, price: np };
      });
    }, 2000);
    return () => clearInterval(iv);
  }, []);

  const btcVal = btc.amount * btc.price;
  const ethVal = eth.amount * eth.price;
  const stakedVal = staked.amount * eth.price;
  const unstakedVal = unstaked * eth.price;
  const total = btcVal + ethVal;
  const btcCostTotal = btc.amount * btc.cost;
  const ethCostTotal = eth.amount * eth.cost;
  const totalCost = btcCostTotal + ethCostTotal;
  const totalPnl = total - totalCost;
  const dailyStakeReward = stakedVal * stakedNetApy / 100 / 365;
  const annualStakeReward = stakedVal * stakedNetApy / 100;
  const compoundedGain = staked.amount - staked.originalDeposit;

  useEffect(() => {
    const prev = spark[spark.length - 1];
    setFlash(total > prev ? "up" : total < prev ? "dn" : null);
    setSpark(p => [...p.slice(1), total]);
    const t = setTimeout(() => setFlash(null), 350);
    return () => clearTimeout(t);
  }, [btc.price, eth.price]);

  const dayPnl = total * 0.028;
  const btcPnl = btcVal - btcCostTotal;
  const ethPnl = ethVal - ethCostTotal;

  const AssetRow = ({ coin, price, amount, val, cost, pnl, pnlPct, chg24, chg7d, pctPort, color, wallets }) => (
    <div style={{ padding: "8px", background: "#06060e", border: `1px solid ${C.border}`, marginBottom: 2 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
        <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
          <span style={{ fontFamily: F, fontSize: 16, fontWeight: 700, color }}>{coin}</span>
          <span style={{ fontFamily: F, fontSize: 20, fontWeight: 700, color: C.white }}>${fmt(Math.round(price))}</span>
        </div>
        <div style={{ display: "flex", gap: 12, alignItems: "baseline" }}>
          <div><Label>24H </Label><span style={{ fontFamily: F, fontSize: 11, color: pC(chg24) }}>{chg24 > 0 ? "+" : ""}{chg24.toFixed(2)}%</span></div>
          <div><Label>7D </Label><span style={{ fontFamily: F, fontSize: 11, color: pC(chg7d) }}>{chg7d > 0 ? "+" : ""}{chg7d.toFixed(2)}%</span></div>
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr 1fr", gap: 12 }}>
        <div><Label>AMOUNT</Label><div style={{ fontFamily: F, fontSize: 12, color: C.text, marginTop: 2 }}>{amount < 10 ? fmtD(amount, 2) : fmtD(amount, 1)}</div></div>
        <div><Label>VALUE</Label><div style={{ fontFamily: F, fontSize: 12, color: C.white, marginTop: 2 }}>${fmt(Math.round(val))}</div></div>
        <div><Label>AVG COST</Label><div style={{ fontFamily: F, fontSize: 12, color: C.dim, marginTop: 2 }}>${fmt(Math.round(cost))}</div></div>
        <div><Label>P&amp;L</Label><div style={{ fontFamily: F, fontSize: 12, color: pC(pnl), marginTop: 2 }}>{pnl >= 0 ? "+" : ""}${fmt(Math.round(pnl))}</div></div>
        <div><Label>RETURN</Label><div style={{ fontFamily: F, fontSize: 12, color: pC(pnlPct), marginTop: 2 }}>{pnlPct >= 0 ? "+" : ""}{pnlPct.toFixed(0)}%</div></div>
      </div>
      {wallets && wallets.length > 0 && (
        <div style={{ marginTop: 6, borderTop: `1px solid ${C.border}`, paddingTop: 4 }}>
          {wallets.map((w, i) => (
            <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "2px 0" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <span style={{ fontFamily: F, fontSize: 9, color: w.type === "cold" ? C.green : C.amber, background: w.type === "cold" ? `${C.green}18` : `${C.amber}18`, padding: "1px 4px", borderRadius: 2 }}>{w.type === "cold" ? "COLD" : "HOT"}</span>
                <span style={{ fontFamily: F, fontSize: 9, color: C.dim }}>{w.label}</span>
                <span style={{ fontFamily: F, fontSize: 9, color: C.muted }}>{w.address}</span>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontFamily: F, fontSize: 9, color: C.text }}>{w.amount} {coin}</span>
                <span style={{ fontFamily: F, fontSize: 9, color: C.dim }}>${fmt(Math.round(w.amount * price))}</span>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );

  return (
    <div style={{ background: C.bg, minHeight: "100vh", fontFamily: F, fontSize: 11, color: C.text, display: "flex", flexDirection: "column" }}>

      {/* TOP BAR */}
      <div style={{ display: "flex", background: "#000008", borderBottom: `2px solid ${C.hdrOrange}`, padding: "3px 8px", alignItems: "center" }}>
        <span style={{ color: C.orange, fontWeight: 900, fontSize: 14, letterSpacing: "0.06em" }}>VAULT</span>
        <span style={{ color: C.muted, fontSize: 9, marginLeft: 8 }}>CRYPTO TERMINAL</span>
        <div style={{ flex: 1 }} />
        <span style={{ width: 6, height: 6, borderRadius: "50%", background: C.green, boxShadow: `0 0 6px ${C.green}`, display: "inline-block", marginRight: 4 }} />
        <span style={{ color: C.dim, fontSize: 10, marginRight: 12 }}>LIVE</span>
        <span style={{ color: C.dim, fontSize: 10, marginRight: 12 }}>{now.toLocaleTimeString("en-US", { hour12: false })}</span>
        <span style={{ color: C.muted, fontSize: 10 }}>{now.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }).toUpperCase()}</span>
      </div>

      {/* PORTFOLIO VALUE BAR */}
      <div style={{ display: "flex", background: "#000008", borderBottom: `1px solid ${C.border}`, padding: "8px", alignItems: "flex-start", gap: 24 }}>
        <div>
          <Label>PORTFOLIO</Label>
          <div style={{
            fontFamily: F, fontSize: 28, fontWeight: 700, color: C.white, marginTop: 2, lineHeight: 1,
            textShadow: flash === "up" ? `0 0 16px ${C.green}40` : flash === "dn" ? `0 0 16px ${C.red}40` : "none",
          }}>${fmt(Math.round(total))}</div>
        </div>
        <div>
          <Label>24H</Label>
          <div style={{ marginTop: 2, whiteSpace: "nowrap", lineHeight: 1, paddingTop: 8 }}>
            <Val color={C.green} size={14}>+${fmt(Math.round(dayPnl))}</Val>
            <span style={{ fontFamily: F, fontSize: 11, color: C.green, marginLeft: 4 }}>+2.80%</span>
          </div>
        </div>
        <div>
          <Label>30D</Label>
          <div style={{ marginTop: 2, whiteSpace: "nowrap", lineHeight: 1, paddingTop: 8 }}>
            <Val color={C.green} size={14}>+$18,420</Val>
            <span style={{ fontFamily: F, fontSize: 11, color: C.green, marginLeft: 4 }}>+2.5%</span>
          </div>
        </div>
        <div>
          <Label>ALL-TIME</Label>
          <div style={{ marginTop: 2, whiteSpace: "nowrap", lineHeight: 1, paddingTop: 8 }}>
            <Val color={C.green} size={14}>+${fmt(Math.round(totalPnl))}</Val>
            <span style={{ fontFamily: F, fontSize: 11, color: C.green, marginLeft: 4 }}>+{((totalPnl / totalCost) * 100).toFixed(0)}%</span>
          </div>
        </div>
        <div style={{ flex: 1 }}>
          <Label>ALLOC</Label>
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 4 }}>
            <div style={{ display: "flex", flex: 1, height: 8, borderRadius: 2, overflow: "hidden", gap: 1 }}>
              <div style={{ width: `${(btcVal / total) * 100}%`, background: "#f7931a" }} />
              <div style={{ width: `${(ethVal / total) * 100}%`, background: "#627eea" }} />
            </div>
            <span style={{ fontFamily: F, fontSize: 9, color: "#f7931a", whiteSpace: "nowrap" }}>BTC {((btcVal / total) * 100).toFixed(0)}%</span>
            <span style={{ fontFamily: F, fontSize: 9, color: "#627eea", whiteSpace: "nowrap" }}>ETH {((ethVal / total) * 100).toFixed(0)}%</span>
          </div>
        </div>
      </div>

      {/* MAIN CONTENT */}
      <div style={{ flex: 1, display: "grid", gridTemplateColumns: "1fr 1fr", gridTemplateRows: "1fr auto", gap: 2, padding: 2, overflow: "auto" }}>

        {/* LEFT: ASSETS */}
        <div style={{ background: C.panel, border: `1px solid ${C.border}`, display: "flex", flexDirection: "column", overflow: "hidden" }}>
          <Header right="2 ASSETS · SPOT + STAKING">HOLDINGS</Header>
          <div style={{ padding: 6, flex: 1, display: "flex", flexDirection: "column", gap: 2 }}>
            <AssetRow
              coin="BTC" price={btc.price} amount={btc.amount} val={btcVal}
              cost={btc.cost} pnl={btcPnl} pnlPct={(btcPnl / btcCostTotal) * 100}
              chg24={btc.chg24} chg7d={btc.chg7d} pctPort={(btcVal / total) * 100}
              color="#f7931a"
              wallets={[
                { label: "Trezor", address: "bc1q7cy...k4nw2", amount: 4.82, type: "cold" },
              ]}
            />
            <AssetRow
              coin="ETH" price={eth.price} amount={eth.amount} val={ethVal}
              cost={eth.cost} pnl={ethPnl} pnlPct={(ethPnl / ethCostTotal) * 100}
              chg24={eth.chg24} chg7d={eth.chg7d} pctPort={(ethVal / total) * 100}
              color="#627eea"
              wallets={[
                { label: "Trezor (staked)", address: "0xd523...be34", amount: 32.0, type: "cold" },
                { label: "Trezor (wallet)", address: "0x7a2e...f41b", amount: 59.4, type: "cold" },
              ]}
            />
          </div>
        </div>

        {/* RIGHT: STAKING & YIELD */}
        <div style={{ background: C.panel, border: `1px solid ${C.border}`, display: "flex", flexDirection: "column", overflow: "hidden" }}>
          <Header color={C.hdrGreen} right={`${staked.protocol} · VIA ${staked.via.toUpperCase()}`}>ETH STAKING</Header>
          <div style={{ padding: 6, flex: 1, display: "flex", flexDirection: "column" }}>

            {/* Staking breakdown */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 2, marginBottom: 6 }}>
              <div style={{ background: "#06060e", border: `1px solid ${C.border}`, padding: "8px" }}>
                <Label>STAKED (EVERSTAKE POOL)</Label>
                <div style={{ fontFamily: F, fontSize: 20, color: C.green, fontWeight: 700, marginTop: 4 }}>{fmtD(staked.amount, 4)} ETH</div>
                <div style={{ fontFamily: F, fontSize: 12, color: C.dim, marginTop: 2 }}>${fmt(Math.round(stakedVal))}</div>
                <div style={{ marginTop: 6, display: "flex", gap: 2 }}>
                  <div style={{ flex: staked.amount, height: 4, background: C.green, borderRadius: 2 }} />
                  <div style={{ flex: unstaked, height: 4, background: C.dim, borderRadius: 2 }} />
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", marginTop: 3 }}>
                  <span style={{ fontSize: 9, color: C.green }}>{((staked.amount / initEth.amount) * 100).toFixed(0)}% staked</span>
                  <span style={{ fontSize: 9, color: C.dim }}>{((unstaked / initEth.amount) * 100).toFixed(0)}% liquid</span>
                </div>
              </div>
              <div style={{ background: "#06060e", border: `1px solid ${C.border}`, padding: "8px" }}>
                <Label>UNSTAKED (TREZOR WALLET)</Label>
                <div style={{ fontFamily: F, fontSize: 20, color: C.text, fontWeight: 700, marginTop: 4 }}>{fmtD(unstaked, 1)} ETH</div>
                <div style={{ fontFamily: F, fontSize: 12, color: C.dim, marginTop: 2 }}>${fmt(Math.round(unstakedVal))}</div>
              </div>
            </div>

            {/* Auto-compound info */}
            <div style={{ background: "#06060e", border: `1px solid ${C.border}`, padding: "8px", marginBottom: 6 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 }}>
                <span style={{ fontFamily: F, fontSize: 13, color: C.white, fontWeight: 600 }}>AUTO-COMPOUNDING</span>
                <span style={{ fontFamily: F, fontSize: 11, color: C.green }}>{stakedNetApy.toFixed(2)}% NET APY</span>
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6, padding: "4px 0", borderBottom: `1px solid ${C.border}` }}>
                <div>
                  <Label>ORIGINAL DEPOSIT</Label>
                  <div style={{ fontFamily: F, fontSize: 14, color: C.dim, marginTop: 2 }}>{fmtD(staked.originalDeposit, 1)} ETH</div>
                </div>
                <div style={{ textAlign: "center" }}>
                  <Label>COMPOUNDED GROWTH</Label>
                  <div style={{ fontFamily: F, fontSize: 14, color: C.green, marginTop: 2 }}>+{fmtD(compoundedGain, 4)} ETH</div>
                </div>
                <div style={{ textAlign: "right" }}>
                  <Label>CURRENT BALANCE</Label>
                  <div style={{ fontFamily: F, fontSize: 14, color: C.white, fontWeight: 600, marginTop: 2 }}>{fmtD(staked.amount, 4)} ETH</div>
                </div>
              </div>
              <div style={{ fontFamily: F, fontSize: 10, color: C.dim, marginBottom: 8 }}>
                Rewards auto-reinvest into your staked balance. No manual claiming required.
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 8 }}>
                <div><Label>DAILY</Label><div style={{ fontFamily: F, fontSize: 13, color: C.green, marginTop: 2 }}>+{fmtD(dailyStakeReward / eth.price, 4)} ETH</div><div style={{ fontFamily: F, fontSize: 10, color: C.dim }}>≈ ${fmtD(dailyStakeReward)}</div></div>
                <div><Label>WEEKLY</Label><div style={{ fontFamily: F, fontSize: 13, color: C.green, marginTop: 2 }}>+{fmtD(dailyStakeReward * 7 / eth.price, 3)} ETH</div><div style={{ fontFamily: F, fontSize: 10, color: C.dim }}>≈ ${fmtD(dailyStakeReward * 7)}</div></div>
                <div><Label>MONTHLY</Label><div style={{ fontFamily: F, fontSize: 13, color: C.green, marginTop: 2 }}>+{fmtD(dailyStakeReward * 30 / eth.price, 2)} ETH</div><div style={{ fontFamily: F, fontSize: 10, color: C.dim }}>≈ ${fmt(Math.round(dailyStakeReward * 30))}</div></div>
                <div><Label>ANNUAL</Label><div style={{ fontFamily: F, fontSize: 13, color: C.green, marginTop: 2 }}>+{fmtD(annualStakeReward / eth.price, 2)} ETH</div><div style={{ fontFamily: F, fontSize: 10, color: C.dim }}>≈ ${fmt(Math.round(annualStakeReward))}</div></div>
              </div>
            </div>

            {/* Staking details */}
            <div style={{ background: "#06060e", border: `1px solid ${C.border}`, padding: "8px", marginBottom: 6 }}>
              <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                {[
                  { l: "PROVIDER", v: "Everstake via Trezor", c: C.text },
                  { l: "STAKING SINCE", v: staked.startDate, c: C.text },
                  { l: "NET APY", v: `${stakedNetApy.toFixed(2)}% (after 10% fee)`, c: C.green },
                ].map(r => (
                  <div key={r.l} style={{ display: "flex", justifyContent: "space-between" }}>
                    <span style={{ fontFamily: F, fontSize: 10, color: C.muted }}>{r.l}</span>
                    <span style={{ fontFamily: F, fontSize: 10, color: r.c }}>{r.v}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Monthly staking earnings */}
            <div style={{ background: "#06060e", border: `1px solid ${C.border}`, padding: "8px", flex: 1 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
                <span style={{ fontFamily: F, fontSize: 11, color: C.white, fontWeight: 600 }}>MONTHLY EARNINGS</span>
                <Label>AUTO-COMPOUNDED</Label>
              </div>
              <div style={{ display: "flex", padding: "2px 0", borderBottom: `1px solid ${C.border}`, marginBottom: 2 }}>
                <span style={{ fontFamily: F, fontSize: 9, color: C.amber, width: 70 }}>MONTH</span>
                <span style={{ fontFamily: F, fontSize: 9, color: C.amber, flex: 1, textAlign: "right" }}>EARNED</span>
                <span style={{ fontFamily: F, fontSize: 9, color: C.amber, flex: 1, textAlign: "right" }}>VALUE</span>
                <span style={{ fontFamily: F, fontSize: 9, color: C.amber, flex: 1, textAlign: "right" }}>BALANCE</span>
              </div>
              {[
                { month: "Mar 2026", earned: 0.0814, value: 218, balance: 32.0000 },
                { month: "Feb 2026", earned: 0.0784, value: 210, balance: 31.9186 },
                { month: "Jan 2026", earned: 0.0812, value: 217, balance: 31.8402 },
                { month: "Dec 2025", earned: 0.0798, value: 214, balance: 31.7590 },
                { month: "Nov 2025", earned: 0.0772, value: 207, balance: 31.6792 },
                { month: "Oct 2025", earned: 0.0801, value: 215, balance: 31.6020 },
                { month: "Sep 2025", earned: 0.0776, value: 208, balance: 31.5219 },
                { month: "Aug 2025", earned: 0.0803, value: 215, balance: 31.4443 },
                { month: "Jul 2025", earned: 0.0799, value: 214, balance: 31.3640 },
                { month: "Jun 2025", earned: 0.0774, value: 207, balance: 31.2841 },
              ].map((m, i) => (
                <div key={m.month} style={{ display: "flex", padding: "3px 0", background: i % 2 === 0 ? "#0e0e1e" : "transparent" }}>
                  <span style={{ fontFamily: F, fontSize: 10, color: C.text, width: 70 }}>{m.month}</span>
                  <span style={{ fontFamily: F, fontSize: 10, color: C.green, flex: 1, textAlign: "right" }}>+{fmtD(m.earned, 4)} ETH</span>
                  <span style={{ fontFamily: F, fontSize: 10, color: C.dim, flex: 1, textAlign: "right" }}>≈ ${fmt(m.value)}</span>
                  <span style={{ fontFamily: F, fontSize: 10, color: C.text, flex: 1, textAlign: "right" }}>{fmtD(m.balance, 4)}</span>
                </div>
              ))}
              <div style={{ display: "flex", padding: "4px 0 0", borderTop: `1px solid ${C.border}`, marginTop: 2 }}>
                <span style={{ fontFamily: F, fontSize: 10, color: C.white, width: 70, fontWeight: 600 }}>TOTAL</span>
                <span style={{ fontFamily: F, fontSize: 10, color: C.green, flex: 1, textAlign: "right", fontWeight: 600 }}>+{fmtD(1.6000, 4)} ETH</span>
                <span style={{ fontFamily: F, fontSize: 10, color: C.dim, flex: 1, textAlign: "right" }}>≈ ${fmt(2125)}</span>
                <span style={{ fontFamily: F, fontSize: 10, flex: 1 }} />
              </div>
            </div>

          </div>
        </div>

        {/* BOTTOM LEFT: Summary */}
        <div style={{ background: "#06060e", border: `1px solid ${C.border}`, padding: "10px 8px" }}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12 }}>
            <div><Label>TOTAL INVESTED</Label><div style={{ fontFamily: F, fontSize: 14, color: C.dim, marginTop: 4 }}>${fmt(Math.round(totalCost))}</div></div>
            <div><Label>CURRENT VALUE</Label><div style={{ fontFamily: F, fontSize: 14, color: C.white, marginTop: 4 }}>${fmt(Math.round(total))}</div></div>
            <div><Label>TOTAL RETURN</Label><div style={{ fontFamily: F, fontSize: 14, color: C.green, marginTop: 4, whiteSpace: "nowrap" }}>+${fmt(Math.round(totalPnl))} <span style={{ color: C.dim }}>(</span>+{((totalPnl / totalCost) * 100).toFixed(0)}%<span style={{ color: C.dim }}>)</span></div></div>
          </div>
        </div>

        {/* BOTTOM RIGHT: Staking Summary */}
        <div style={{ background: "#06060e", border: `1px solid ${C.border}`, padding: "10px 8px" }}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12 }}>
            <div><Label>ORIGINAL STAKE</Label><div style={{ fontFamily: F, fontSize: 14, color: C.dim, marginTop: 4 }}>{fmtD(staked.originalDeposit, 1)} ETH</div></div>
            <div><Label>CURRENT BALANCE</Label><div style={{ fontFamily: F, fontSize: 14, color: C.white, marginTop: 4 }}>{fmtD(staked.amount, 1)} ETH</div></div>
            <div><Label>EARNED</Label><div style={{ fontFamily: F, fontSize: 14, color: C.green, marginTop: 4, whiteSpace: "nowrap" }}>+{fmtD(compoundedGain, 1)} ETH <span style={{ color: C.dim }}>(</span>≈${fmt(Math.round(compoundedGain * eth.price))}<span style={{ color: C.dim }}>)</span></div></div>
          </div>
        </div>
      </div>

      {/* COMMAND LINE */}
      <div style={{ display: "flex", alignItems: "center", background: "#000008", borderTop: `2px solid ${C.hdrOrange}`, padding: "4px 8px", gap: 6 }}>
        <span style={{ color: C.orange, fontWeight: 700 }}>VAULT&gt;</span>
        <input
          value={cmd} onChange={e => setCmd(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter") setCmd(""); }}
          placeholder="ADD · REMOVE · EXPORT"
          style={{ flex: 1, background: "transparent", border: "none", outline: "none", color: C.white, fontFamily: F, fontSize: 12, caretColor: C.orange }}
        />
        <span style={{ color: C.muted, fontSize: 9 }}>E2E ENCRYPTED</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Vault />);
    </script>
</body>
</html>
